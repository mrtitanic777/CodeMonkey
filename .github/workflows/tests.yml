name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest, and the optional packages some tests cover
        run: python -m pip install pytest pyflakes anthropic
      - name: Run the tests
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest -q -p no:cacheprovider tests kernel/tests
